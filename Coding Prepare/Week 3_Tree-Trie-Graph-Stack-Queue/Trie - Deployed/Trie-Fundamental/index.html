<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hidden Archive of Prefixes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@400;600;700&display=swap');

    :root {
      --paper-bg: #fdf6e3;
      --ink-color: #433422;
      --wood-accent: #8c5e3c;
      --autumn-orange: #d97706;
      --moss-green: #65a30d;
      --sky-blue: #e0f2fe;
    }

    body {
      background-color: var(--sky-blue);
      color: var(--ink-color);
      font-family: 'Crimson Pro', serif;
      overflow-x: hidden;
    }

    /* Moving Clouds Background */
    .sky-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(to bottom, #e0f2fe 0%, #f0f9ff 50%, #fdf6e3 100%);
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      opacity: 0.8;
      filter: blur(8px);
      animation: drift linear infinite;
    }

    .cloud::after, .cloud::before {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    @keyframes drift {
      from { transform: translateX(-100%); }
      to { transform: translateX(100vw); }
    }

    /* Soot Sprites Animation */
    .soot-sprite {
      width: 30px;
      height: 30px;
      background: #1a1a1a;
      border-radius: 50%;
      position: fixed;
      filter: blur(1px);
      z-index: 0;
      animation: bounce 3s infinite ease-in-out;
    }
    .soot-sprite::before, .soot-sprite::after {
      content: '';
      position: absolute;
      top: 8px;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
    }
    .soot-sprite::before { left: 5px; }
    .soot-sprite::after { right: 5px; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .font-sans { font-family: 'Nunito', sans-serif; }
    .font-serif { font-family: 'Crimson Pro', serif; }

    .animate-fade-in {
      animation: fadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Watercolor Card Effect */
    .watercolor-card {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 16px;
      box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.05),
        0 0 40px -10px rgba(217, 119, 6, 0.1); 
      border: 1px solid rgba(231, 229, 228, 0.8);
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <!-- Atmospheric Elements -->
  <div class="sky-container">
    <div class="cloud" style="width: 200px; height: 60px; top: 10%; left: -200px; animation-duration: 40s;"></div>
    <div class="cloud" style="width: 300px; height: 100px; top: 25%; left: -300px; animation-duration: 60s; animation-delay: 5s;"></div>
    <div class="cloud" style="width: 150px; height: 50px; top: 60%; left: -150px; animation-duration: 45s; animation-delay: 15s;"></div>
  </div>
  
  <div class="soot-sprite" style="bottom: 20px; left: 5%;"></div>
  <div class="soot-sprite" style="bottom: 40px; left: 8%; animation-delay: 0.5s; width: 20px; height: 20px;"></div>
  
  <div id="root"></div>
