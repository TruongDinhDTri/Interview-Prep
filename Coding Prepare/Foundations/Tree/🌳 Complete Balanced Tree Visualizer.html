<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Balance Academy - Complete Balanced Tree Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ecfdf5 0%, #ccfbf1 50%, #cffafe 100%);
      padding: 1.5rem;
    }

    .container {
      max-width: 80rem;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header-icons {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(90deg, #059669, #0d9488, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: #0f766e;
      font-size: 1.125rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    /* Definitions Section */
    .definitions-section {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border: 2px solid #a7f3d0;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .section-title h2 {
      font-size: 1.875rem;
      font-weight: 900;
      color: #1f2937;
    }

    .definitions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .definitions-grid {
        grid-template-columns: 1fr;
      }
    }

    .definition-card {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border-radius: 0.75rem;
      padding: 1.25rem;
      border: 2px solid #93c5fd;
      transition: box-shadow 0.3s ease;
    }

    .definition-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .definition-card.purple {
      background: linear-gradient(135deg, #faf5ff 0%, #ede9fe 100%);
      border-color: #c4b5fd;
    }

    .definition-card.amber {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-color: #fcd34d;
    }

    .definition-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .definition-header h3 {
      font-size: 1.25rem;
      font-weight: 900;

    }

    .definition-card.purple .definition-header h3 {

    }

    .definition-card.amber .definition-header h3 {

    }

    .definition-card p {

      margin-bottom: 0.75rem;

    .definition-examples {

      border: 1px solid #bfdbfe;

    .definition-card.purple .definition-examples {
      border-color: #c4b5fd;
    }

    .definition-card.amber .definition-examples {
      border-color: #fcd34d;
    }

    .example-title {
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #1e40af;
    }

    .definition-card.purple .example-title {

    }

    .definition-card.amber .example-title {

    }

    .example-list {

    /* Formula Section */

    @media (max-width: 768px) {

    .formula-card {

    .formula-header {

    .formula-main {

    .formula-examples {

    .formula-example {

    /* Rules Cards */
    .rules-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .rule-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 2px solid #86efac;

    .rule-card.red {
      border-color: #fca5a5;

    .rule-header {

      align-items: center;

      margin-bottom: 0.5rem;
    }

    .rule-header h3 {
      font-weight: 900;
      font-size: 1.125rem;

    }

    .rule-card.red .rule-header h3 {

    }

    .rule-formula {

    .rule-card.red .rule-formula {

      color: #374151;
    }

    /* Main Content */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    /* Trees Column */
    .trees-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .tree-card {
      background: linear-gradient(135deg, #4ade80 0%, #10b981 100%);
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 1.5rem;
      border: 2px solid #86efac;
    }

    .tree-card.unbalanced {
      background: linear-gradient(135deg, #f87171 0%, #f97316 100%);
      border-color: #fca5a5;
    }

    .tree-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .tree-header h3 {
      font-size: 1.875rem;
      font-weight: 900;
      color: white;
    }

    .tree-svg-container {
      background: white;
      border-radius: 0.75rem;
      padding: 1rem;
    }

    .tree-svg {
      width: 100%;
    }

    .tree-svg circle {
      cursor: pointer;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }

    .tree-svg text {
      user-select: none;
      pointer-events: none;
    }

    .tree-footer {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 0.75rem;
      text-align: center;
      border: 2px solid #86efac;

    .tree-card.unbalanced .tree-footer {
      border-color: #fca5a5;

    .tree-footer-title {
      font-size: 1.125rem;
      font-weight: 900;
      color: #15803d;
      margin-bottom: 0.25rem;
    }

    .tree-card.unbalanced .tree-footer-title {
      color: #b91c1c;
    }

    .tree-footer-desc {
      font-size: 0.875rem;
      color: #374151;
    }

    /* Calculation Panel */
    .calc-panel {
      position: sticky;
      top: 1.5rem;
      height: fit-content;
    }

    .calc-card {
      background: linear-gradient(135deg, #14b8a6 0%, #0891b2 100%);
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 1.5rem;
      border: 2px solid #5eead4;
    }

    .calc-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .calc-header h2 {
      font-size: 1.875rem;
      font-weight: 900;
      color: white;
    }

    .calc-badge {
      margin-left: auto;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 900;
      border: 2px solid;
    }

    .calc-badge.balanced {
      background: #4ade80;
      color: #14532d;
      border-color: #86efac;
    }

    .calc-badge.unbalanced {
      background: #f87171;
      color: #7f1d1d;
      border-color: #fca5a5;
    }

    .calc-section {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      border: 2px solid #67e8f9;

    .calc-section-title {
      font-weight: 900;
      color: #0f766e;
      font-size: 1.25rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .props-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .prop-card {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border-radius: 0.5rem;
      padding: 1rem;
      border: 2px solid #93c5fd;
    }

    .prop-card.purple {
      background: linear-gradient(135deg, #faf5ff 0%, #ede9fe 100%);
      border-color: #c4b5fd;
    }

    .prop-card.pink {
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
      border-color: #f9a8d4;
    }

    .prop-card.amber {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);

    }

    .prop-label {
      font-size: 0.875rem;

      margin-bottom: 0.25rem;

    .prop-card .prop-label { color: #1d4ed8; }
    .prop-card.purple .prop-label { color: #7c3aed; }
    .prop-card.pink .prop-label { color: #db2777; }
    .prop-card.amber .prop-label { color: #d97706; }

    .prop-value {
      font-weight: 900;
      font-size: 1.875rem;
    }

    .prop-card .prop-value { color: #2563eb; }
    .prop-card.purple .prop-value { color: #7c3aed; }
    .prop-card.pink .prop-value { color: #db2777; }
    .prop-card.amber .prop-value { color: #d97706; }

    .child-info {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .child-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-radius: 0.5rem;

    .child-row.left {
      background: linear-gradient(90deg, #ecfdf5 0%, #d1fae5 100%);

    .child-row.right {

    .child-row span {

      color: #374151;
    }

    .child-row .value {
      font-weight: 900;

    }

    .child-row.left .value { color: #059669; }
    .child-row.right .value { color: #ea580c; }

    /* Calculation Steps */
    .calc-steps {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .calc-step {
      padding: 1rem;
      border-radius: 0.5rem;

    }

    .calc-step.step1 {

    }

    .calc-step.step2 {

    .calc-step.step3 {

    .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;

    .calc-step.step1 .step-label { color: #1d4ed8; }
    .calc-step.step2 .step-label { color: #7c3aed; }
    .calc-step.step3 .step-label { color: #4f46e5; }

    .step-formula {
      font-family: monospace;
      font-size: 1rem;
      color: #1f2937;
    }

    .step-formula .highlight {

    .step-formula .green { color: #059669; }
    .step-formula .orange { color: #ea580c; }
    .step-formula .purple { color: #7c3aed; }

    .result-box {
      background: linear-gradient(90deg, #facc15 0%, #fbbf24 100%);
      border-radius: 0.5rem;
      padding: 1rem;
      text-align: center;
      border: 2px solid #fde047;
    }

    .result-label {

      font-weight: 700;
      color: #713f12;
      margin-bottom: 0.25rem;
    }

    .result-value {

    /* Balance Check */
    .balance-section {
      border-radius: 0.75rem;
      padding: 1.25rem;
      border: 2px solid;
    }

    .balance-section.balanced {
      background: linear-gradient(135deg, #4ade80 0%, #10b981 100%);
      border-color: #86efac;
    }

    .balance-section.unbalanced {

      border-radius: 0.5rem;

    }

    .balance-factor-label {
      font-size: 0.875rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    .balance-factor-formula {
      font-family: monospace;
      font-size: 1.125rem;

    .balance-factor-result {
      font-weight: 900;
      font-size: 1.5rem;
      color: #7c3aed;
    }

    .balance-result {
      border-radius: 0.5rem;
      padding: 1rem;

      border: 2px solid;

<body>
  <div class="container" id="app"></div>

  <script>
    // ===== STATE =====
    let state = {
      selectedNode: null,
      showCalculation: false
    };

    // ===== TREE DATA =====
    const balancedTree = {
      '1': { value: '1', x: 200, y: 50, leftChild: '2', rightChild: '3', leftHeight: 2, rightHeight: 1, height: 3, depth: 0, level: 0, balanced: true },
      '2': { value: '2', x: 120, y: 130, leftChild: '4', rightChild: '5', leftHeight: 1, rightHeight: 0, height: 2, depth: 1, level: 1, balanced: true },
      '3': { value: '3', x: 280, y: 130, leftChild: '6', rightChild: null, leftHeight: 0, rightHeight: -1, height: 1, depth: 1, level: 1, balanced: true },
      '4': { value: '4', x: 70, y: 210, leftChild: '7', rightChild: null, leftHeight: 0, rightHeight: -1, height: 1, depth: 2, level: 2, balanced: true },
      '5': { value: '5', x: 170, y: 210, leftChild: null, rightChild: null, leftHeight: -1, rightHeight: -1, height: 0, depth: 2, level: 2, balanced: true },
      '6': { value: '6', x: 280, y: 210, leftChild: null, rightChild: null, leftHeight: -1, rightHeight: -1, height: 0, depth: 2, level: 2, balanced: true },
      '7': { value: '7', x: 50, y: 290, leftChild: null, rightChild: null, leftHeight: -1, rightHeight: -1, height: 0, depth: 3, level: 3, balanced: true }
    };

    const unbalancedTree = {
      '1': { value: '1', x: 200, y: 50, leftChild: '2', rightChild: '3', leftHeight: 4, rightHeight: 0, height: 5, depth: 0, level: 0, balanced: false },
      '2': { value: '2', x: 120, y: 130, leftChild: '4', rightChild: null, leftHeight: 3, rightHeight: -1, height: 4, depth: 1, level: 1, balanced: false },
      '3': { value: '3', x: 280, y: 130, leftChild: null, rightChild: null, leftHeight: -1, rightHeight: -1, height: 0, depth: 1, level: 1, balanced: true },
      '4': { value: '4', x: 70, y: 210, leftChild: '5', rightChild: null, leftHeight: 2, rightHeight: -1, height: 3, depth: 2, level: 2, balanced: false },
      '5': { value: '5', x: 40, y: 290, leftChild: '6', rightChild: null, leftHeight: 1, rightHeight: -1, height: 2, depth: 3, level: 3, balanced: false },
      '6': { value: '6', x: 25, y: 370, leftChild: '7', rightChild: null, leftHeight: 0, rightHeight: -1, height: 1, depth: 4, level: 4, balanced: false },
      '7': { value: '7', x: 15, y: 450, leftChild: null, rightChild: null, leftHeight: -1, rightHeight: -1, height: 0, depth: 5, level: 5, balanced: true }
    };

    // ===== HELPER FUNCTIONS =====
    function selectNode(type, nodeId) {
      state.selectedNode = `${type}-${nodeId}`;
      state.showCalculation = true;
      render();
    }

    function getCalculationSteps() {
      if (!state.selectedNode) return null;

      const [type, nodeId] = state.selectedNode.split('-');
      const tree = type === 'b' ? balancedTree : unbalancedTree;
      const node = tree[nodeId];

      const leftChildHeight = node.leftChild ? tree[node.leftChild].height : -1;
      const rightChildHeight = node.rightChild ? tree[node.rightChild].height : -1;

      return {
        node,
        leftChildHeight,
        rightChildHeight,
        type: type === 'b' ? 'Balanced' : 'Unbalanced'
      };
    }

    // ===== RENDER TREE SVG =====
    function renderTreeSVG(tree, isBalanced) {
      const type = isBalanced ? 'b' : 'u';
      let svg = '';

      // Render edges
      Object.keys(tree).forEach(nodeId => {
        const node = tree[nodeId];
        if (node.leftChild) {
          const left = tree[node.leftChild];
          svg += `<line x1="${node.x}" y1="${node.y}" x2="${left.x}" y2="${left.y}" stroke="#94a3b8" stroke-width="3" opacity="0.7"/>`;
          svg += `<text x="${(node.x + left.x) / 2 - 12}" y="${(node.y + left.y) / 2}" font-size="12" font-weight="bold" fill="#475569">L</text>`;
        }
        if (node.rightChild) {
          const right = tree[node.rightChild];
          svg += `<line x1="${node.x}" y1="${node.y}" x2="${right.x}" y2="${right.y}" stroke="#94a3b8" stroke-width="3" opacity="0.7"/>`;
          svg += `<text x="${(node.x + right.x) / 2 + 12}" y="${(node.y + right.y) / 2}" font-size="12" font-weight="bold" fill="#475569">R</text>`;
        }
      });

      // Render nodes
      Object.keys(tree).forEach(nodeId => {
        const node = tree[nodeId];
        const balanceFactor = Math.abs((node.leftHeight + 1) - (node.rightHeight + 1));
        const nodeBalanced = balanceFactor <= 1;
        const isSelected = state.selectedNode === `${type}-${nodeId}`;
        const radius = isSelected ? 28 : 24;
        const fill = nodeBalanced ? '#22c55e' : '#ef4444';

        svg += `<circle cx="${node.x}" cy="${node.y}" r="${radius}" fill="${fill}" data-type="${type}" data-node="${nodeId}" style="cursor:pointer"/>`;

        if (isSelected) {
          svg += `<circle cx="${node.x}" cy="${node.y}" r="${radius}" fill="none" stroke="#fbbf24" stroke-width="4"/>`;
        }

        svg += `<text x="${node.x}" y="${node.y + 6}" text-anchor="middle" font-size="16" font-weight="bold" fill="white">${node.value}</text>`;
        svg += `<text x="${node.x}" y="${node.y - 35}" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b5cf6">h=${node.height}</text>`;
      });

      return svg;
    }

    // ===== MAIN RENDER =====
    function render() {
      const app = document.getElementById('app');
      const calc = getCalculationSteps();

      let html = `
        <!-- Header -->
        <div class="header">
          <div class="header-icons">
            <span style="font-size:3rem">🌳</span>
            <h1>Tree Balance Academy</h1>
            <span style="font-size:3rem">📖</span>
          </div>
          <p>
            <span>✨</span>
            Learn, Explore, and Master Binary Tree Concepts!
            <span>✨</span>
          </p>
        </div>

        <!-- Definitions Section -->
        <div class="definitions-section">
          <div class="section-title">
            <span style="font-size:2rem">📖</span>
            <h2>📚 Key Definitions</h2>
          </div>
          <div class="definitions-grid">
            <!-- Height -->
            <div class="definition-card">
              <div class="definition-header">
                <span style="font-size:1.75rem">⬇️</span>
                <h3>📏 Height</h3>
              </div>
              <p>The <strong style="color:#1d4ed8">longest path</strong> from a node <strong>DOWN</strong> to any leaf node.</p>
              <div class="definition-examples">
                <div class="example-title">Examples:</div>
                <div class="example-list">
                  <div>🍃 <strong>Leaf node:</strong> height = 0</div>
                  <div>🌿 <strong>Null:</strong> height = -1</div>
                  <div>🌳 <strong>Root:</strong> max path to leaf</div>
                </div>
              </div>
            </div>

            <!-- Depth -->
            <div class="definition-card purple">
              <div class="definition-header">
                <span style="font-size:1.75rem">⬆️</span>
                <h3>⬇️ Depth</h3>
              </div>
              <p>The <strong style="color:#7c3aed">number of edges</strong> from the root <strong>UP</strong> to this node.</p>
              <div class="definition-examples">
                <div class="example-title">Examples:</div>
                <div class="example-list">
                  <div>🎯 <strong>Root node:</strong> depth = 0</div>
                  <div>📍 <strong>Child of root:</strong> depth = 1</div>
                  <div>🔢 <strong>Increases</strong> going down</div>
                </div>
              </div>
            </div>

            <!-- Balance -->
            <div class="definition-card amber">
              <div class="definition-header">
                <span style="font-size:1.75rem">📚</span>
                <h3>⚖️ Balance</h3>
              </div>
              <p>A node is <strong style="color:#d97706">balanced</strong> when left and right subtree heights differ by <strong>≤ 1</strong>.</p>
              <div class="definition-examples">
                <div class="example-title">Formula:</div>
                <div class="example-list">
                  <div class="formula-box">|height(L) - height(R)| ≤ 1</div>
                  <div>✅ <strong>Balanced:</strong> difference ≤ 1</div>
                  <div>❌ <strong>Unbalanced:</strong> difference > 1</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Formula & Rules -->
        <div class="formula-grid">
          <!-- Height Formula -->
          <div class="formula-card">
            <div class="formula-header">
              <span style="font-size:2rem">🧠</span>
              <h2>🧮 Height Formula</h2>
            </div>
            <div class="formula-content">
              <div class="formula-main">h = max(L, R) + 1</div>
              <div class="formula-examples">
                <div class="formula-example">
                  <div class="formula-example-icon">🍃</div>
                  <div class="formula-example-label">Leaf</div>
                  <div class="formula-example-value">h = 0</div>
                </div>
                <div class="formula-example">
                  <div class="formula-example-icon">🌿</div>
                  <div class="formula-example-label">Null</div>
                  <div class="formula-example-value">h = -1</div>
                </div>
                <div class="formula-example">
                  <div class="formula-example-icon">⚖️</div>
                  <div class="formula-example-label">Factor</div>
                  <div class="formula-example-value">|L-R|</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Balance Rules -->
          <div class="formula-card emerald">
            <div class="formula-header">
              <span style="font-size:2rem">ℹ️</span>
              <h2>📋 Balance Rules</h2>
            </div>
            <div class="rules-container">
              <div class="rule-card">
                <div class="rule-header">
                  <span style="font-size:1.5rem;color:#16a34a">✅</span>
                  <h3>✅ Balanced</h3>
                </div>
                <div class="rule-formula">|height(L) - height(R)| ≤ 1</div>
                <p class="rule-desc">Perfect harmony! Tree is efficient for operations.</p>
              </div>
              <div class="rule-card red">
                <div class="rule-header">
                  <span style="font-size:1.5rem;color:#dc2626">❌</span>
                  <h3>❌ Unbalanced</h3>
                </div>
                <div class="rule-formula">|height(L) - height(R)| > 1</div>
                <p class="rule-desc">One side too heavy! May need rebalancing (AVL rotation).</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
          <!-- Trees Column -->
          <div class="trees-column">
            <!-- Balanced Tree -->
            <div class="tree-card">
              <div class="tree-header">
                <span style="font-size:2rem">📈</span>
                <h3>✅ BALANCED TREE</h3>
              </div>
              <div class="tree-svg-container">
                <svg viewBox="0 0 400 320" class="tree-svg" id="balancedTreeSvg">
                  ${renderTreeSVG(balancedTree, true)}
                </svg>
              </div>
              <div class="tree-footer">
                <div class="tree-footer-title">🌳 Perfect Balance!</div>
                <div class="tree-footer-desc">All nodes maintain |L-R| ≤ 1</div>
              </div>
            </div>

            <!-- Unbalanced Tree -->
            <div class="tree-card unbalanced">
              <div class="tree-header">
                <span style="font-size:2rem">📉</span>
                <h3>❌ UNBALANCED TREE</h3>
              </div>
              <div class="tree-svg-container">
                <svg viewBox="0 0 400 480" class="tree-svg" id="unbalancedTreeSvg" style="height:20rem">
                  ${renderTreeSVG(unbalancedTree, false)}
                </svg>
              </div>
              <div class="tree-footer">
                <div class="tree-footer-title">🚨 Needs Rebalancing!</div>
                <div class="tree-footer-desc">Node 1: |4-0| = 4 > 1</div>
              </div>
            </div>
          </div>

          <!-- Calculation Panel -->
          <div class="calc-panel">
            <div class="calc-card">
              ${state.showCalculation && calc ? `
                <div class="calc-header">
                  <span style="font-size:2.25rem">🧮</span>
                  <h2>📊 Node ${calc.node.value} Analysis</h2>
                  <span class="calc-badge ${calc.type === 'Balanced' ? 'balanced' : 'unbalanced'}">${calc.type}</span>
                </div>

                <!-- Node Properties -->
                <div class="calc-section">
                  <h4 class="calc-section-title"><span style="font-size:1.5rem">ℹ️</span> 📍 Node Properties</h4>
                  <div class="props-grid">
                    <div class="prop-card">
                      <div class="prop-label">Value</div>
                      <div class="prop-value">${calc.node.value}</div>
                    </div>
                    <div class="prop-card purple">
                      <div class="prop-label">Height</div>
                      <div class="prop-value">${calc.node.height}</div>
                    </div>
                    <div class="prop-card pink">
                      <div class="prop-label">Depth</div>
                      <div class="prop-value">${calc.node.depth}</div>
                    </div>
                    <div class="prop-card amber">
                      <div class="prop-label">Level</div>
                      <div class="prop-value">${calc.node.level}</div>
                    </div>
                  </div>
                </div>

                <!-- Children Info -->
                <div class="calc-section">
                  <h4 class="calc-section-title">🌳 Child Subtrees</h4>
                  <div class="child-info">
                    <div class="child-row left">
                      <span>Left Child:</span>
                      <span class="value">${calc.node.leftChild ? `Node ${calc.node.leftChild}` : 'null'}</span>
                    </div>
                    <div class="child-row left">
                      <span>Left Height:</span>
                      <span class="value">${calc.leftChildHeight === -1 ? '-1' : calc.leftChildHeight}</span>
                    </div>
                    <div class="child-row right">
                      <span>Right Child:</span>
                      <span class="value">${calc.node.rightChild ? `Node ${calc.node.rightChild}` : 'null'}</span>
                    </div>
                    <div class="child-row right">
                      <span>Right Height:</span>
                      <span class="value">${calc.rightChildHeight === -1 ? '-1' : calc.rightChildHeight}</span>
                    </div>
                  </div>
                </div>

                <!-- Calculation Steps -->
                <div class="calc-section" style="border-color:#fde047">
                  <h4 class="calc-section-title" style="color:#92400e">🧮 Calculation Steps</h4>
                  <div class="calc-steps">
                    <div class="calc-step step1">
                      <div class="step-label">STEP 1: Get Child Heights</div>
                      <div class="step-formula">
                        left = <span class="highlight green">${calc.leftChildHeight}</span>,
                        right = <span class="highlight orange">${calc.rightChildHeight}</span>
                      </div>
                    </div>
                    <div class="calc-step step2">
                      <div class="step-label">STEP 2: Find Maximum</div>
                      <div class="step-formula">
                        max(${calc.leftChildHeight}, ${calc.rightChildHeight}) = <span class="highlight purple" style="font-size:1.25rem">${Math.max(calc.leftChildHeight, calc.rightChildHeight)}</span>
                      </div>
                    </div>
                    <div class="calc-step step3">
                      <div class="step-label">STEP 3: Add 1 (Current Node)</div>
                      <div class="step-formula">
                        ${Math.max(calc.leftChildHeight, calc.rightChildHeight)} + 1 = <span class="highlight indigo" style="font-size:1.5rem">${calc.node.height}</span>
                      </div>
                    </div>
                    <div class="result-box">
                      <div class="result-label">✨ FINAL RESULT ✨</div>
                      <div class="result-value">height(Node ${calc.node.value}) = ${calc.node.height}</div>
                    </div>
                  </div>
                </div>

                <!-- Balance Check -->
                <div class="balance-section ${calc.node.balanced ? 'balanced' : 'unbalanced'}">
                  <h4 class="balance-title">⚖️ Balance Verification</h4>
                  <div class="balance-factor">
                    <div class="balance-factor-label">Balance Factor:</div>
                    <div class="balance-factor-formula">
                      |${calc.leftChildHeight} - ${calc.rightChildHeight}| = <span class="balance-factor-result">${Math.abs(calc.leftChildHeight - calc.rightChildHeight)}</span>
                    </div>
                  </div>
                  <div class="balance-result ${calc.node.balanced ? 'balanced' : 'unbalanced'}">
                    <div class="balance-result-formula">
                      ${Math.abs(calc.leftChildHeight - calc.rightChildHeight)} ${calc.node.balanced ? '≤' : '>'} 1
                    </div>
                    <div class="balance-result-text">
                      ${calc.node.balanced ? '✅ BALANCED' : '❌ UNBALANCED'}
                    </div>
                  </div>
                </div>
              ` : `
                <div class="empty-state">
                  <div class="empty-state-icon">🎯</div>
                  <h3>👆 Click Any Node!</h3>
                  <p>Select a node from either tree to see detailed calculations, balance analysis, and step-by-step breakdowns! 🎯✨</p>
                </div>
              `}
            </div>
          </div>
        </div>
      `;

      app.innerHTML = html;
      attachEventListeners();
    }

    // ===== EVENT LISTENERS =====
    function attachEventListeners() {
      // Balanced tree clicks
      document.querySelectorAll('#balancedTreeSvg circle[data-node]').forEach(circle => {
        circle.addEventListener('click', () => {
          selectNode('b', circle.dataset.node);
        });
      });

      // Unbalanced tree clicks
      document.querySelectorAll('#unbalancedTreeSvg circle[data-node]').forEach(circle => {
        circle.addEventListener('click', () => {
          selectNode('u', circle.dataset.node);
        });
      });
    }

    // ===== INIT =====
    render();
  </script>
</body>
</html>
