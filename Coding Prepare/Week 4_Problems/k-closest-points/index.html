<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhibliAlgo: K Closest Points</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f0f4f8;
      }
      .font-hand {
        font-family: 'Patrick Hand', cursive;
      }
      /* Ghibli-esque Clouds Animation */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.05);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(0,0,0,0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<style id="mobile-safety-net">
/* ===== MOBILE SAFETY NET — auto-injected, non-destructive ===== */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
img,svg,video,canvas,iframe{max-width:100%;height:auto;}
pre{overflow-x:auto;max-width:100%;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:12px 0;}
.tbl-scroll>table{margin:0;}
@media (max-width:600px){
  table{max-width:100%;}
  h1,h2,h3{overflow-wrap:anywhere;word-break:break-word;}
}
</style>
<script id="mobile-safety-net-js">
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('table').forEach(function(t){
    var p=t.parentElement;
    if(p&&p.classList&&p.classList.contains('tbl-scroll'))return;
    var w=document.createElement('div');w.className='tbl-scroll';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
});
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
