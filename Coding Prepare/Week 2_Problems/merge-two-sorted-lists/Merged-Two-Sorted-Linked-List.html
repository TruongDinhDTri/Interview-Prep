<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge Two Sorted Linked Lists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style id="mobile-safety-net">
/* ===== MOBILE SAFETY NET — auto-injected, non-destructive ===== */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
img,svg,video,canvas,iframe{max-width:100%;height:auto;}
pre{overflow-x:auto;max-width:100%;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:12px 0;}
.tbl-scroll>table{margin:0;}
@media (max-width:600px){
  table{max-width:100%;}
  h1,h2,h3{overflow-wrap:anywhere;word-break:break-word;}
}
</style>
<script id="mobile-safety-net-js">
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('table').forEach(function(t){
    var p=t.parentElement;
    if(p&&p.classList&&p.classList.contains('tbl-scroll'))return;
    var w=document.createElement('div');w.className='tbl-scroll';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
});
</script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Inline SVG icons (replacing lucide-react)
    const Play = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );

    const Pause = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    );

    const RotateCcw = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
    );

    const ChevronLeft = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    );

    const ChevronRight = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    );

    const MergeSortedListsSimple = () => {
      const [step, setStep] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(1000);
      const intervalRef = useRef(null);

      const list1 = [1, 4, 7];
      const list2 = [2, 3, 8];

      const steps = [
        { result: [], p1: 0, p2: 0, action: "Start with two pointers" },
        { result: [1], p1: 1, p2: 0, action: "1 < 2, take 1" },
        { result: [1, 2], p1: 1, p2: 1, action: "4 > 2, take 2" },
        { result: [1, 2, 3], p1: 1, p2: 2, action: "4 > 3, take 3" },
        { result: [1, 2, 3, 4], p1: 2, p2: 2, action: "4 < 8, take 4" },
        { result: [1, 2, 3, 4, 7], p1: 3, p2: 2, action: "7 < 8, take 7" },
        { result: [1, 2, 3, 4, 7, 8], p1: 3, p2: 3, action: "List1 done, take 8. Complete!" }
      ];

      const currentStep = steps[step];

      useEffect(() => {
        if (isPlaying) {
          intervalRef.current = setInterval(() => {
            setStep(prev => {
              if (prev >= steps.length - 1) {
                setIsPlaying(false);
                return prev;
              }
              return prev + 1;
            });
          }, speed);
        }
        return () => clearInterval(intervalRef.current);
      }, [isPlaying, speed, steps.length]);

      const togglePlay = () => {
        if (step >= steps.length - 1) {
          setStep(0);
        }
        setIsPlaying(!isPlaying);
      };

      const reset = () => {
        setStep(0);
        setIsPlaying(false);
      };

      const prevStep = () => {
        setIsPlaying(false);
        setStep(prev => Math.max(0, prev - 1));
      };

      const nextStep = () => {
        setIsPlaying(false);
        setStep(prev => Math.min(steps.length - 1, prev + 1));
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-purple-100 to-pink-100 p-6">
          <div className="max-w-6xl mx-auto space-y-6">

            {/* Title */}
            <div className="bg-white rounded-xl shadow-lg p-6 text-center">
              <h1 className="text-3xl font-bold text-gray-800">Merge Two Sorted Linked Lists</h1>
              <p className="text-gray-600 mt-2">Compare values, pick smaller, move pointer ➜ repeat!</p>
            </div>

            {/* Visualization */}
            <div className="bg-white rounded-xl shadow-lg p-6">
              <div className="text-center mb-4">
                <span className="bg-purple-100 text-purple-800 px-4 py-2 rounded-full font-semibold">
                  Step {step + 1}/{steps.length}
                </span>
              </div>

              {/* Lists */}
              <div className="space-y-4 mb-6">
                <div className="flex items-center gap-3">
                  <div className="font-bold text-gray-700 w-20">List 1:</div>
                  <div className="flex gap-2">
                    {list1.map((val, idx) => (
                      <div key={idx} className={`w-16 h-16 flex items-center justify-center rounded-lg font-bold text-xl transition-all ${
                        idx === currentStep.p1 && currentStep.p1 < list1.length ? 'bg-yellow-400 scale-110' :
                        idx < currentStep.p1 ? 'bg-gray-300 text-gray-500' : 'bg-blue-500 text-white'
                      }`}>
                        {val}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="font-bold text-gray-700 w-20">List 2:</div>
                  <div className="flex gap-2">
                    {list2.map((val, idx) => (
                      <div key={idx} className={`w-16 h-16 flex items-center justify-center rounded-lg font-bold text-xl transition-all ${
                        idx === currentStep.p2 && currentStep.p2 < list2.length ? 'bg-yellow-400 scale-110' :
                        idx < currentStep.p2 ? 'bg-gray-300 text-gray-500' : 'bg-pink-500 text-white'
                      }`}>
                        {val}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="flex items-center gap-3 bg-green-50 p-4 rounded-lg">
                  <div className="font-bold text-green-700 w-20">Result:</div>
                  <div className="flex gap-2">
                    {currentStep.result.length === 0 ? (
                      <div className="text-gray-400 text-xl">[ empty ]</div>
                    ) : (
                      currentStep.result.map((val, idx) => (
                        <div key={idx} className="w-16 h-16 flex items-center justify-center bg-green-500 text-white rounded-lg font-bold text-xl">
                          {val}
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>

              {/* Action */}
              <div className="bg-blue-50 p-4 rounded-lg text-center">
                <div className="text-lg font-bold text-blue-900">{currentStep.action}</div>
              </div>

              {/* Controls */}
              <div className="flex justify-center items-center gap-3 mt-6 flex-wrap">
                <button onClick={reset} className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 flex items-center gap-2">
                  <RotateCcw size={18} /> Reset
                </button>

                <button
                  onClick={prevStep}
                  disabled={step === 0}
                  className={`px-4 py-2 rounded-lg flex items-center gap-2 font-semibold ${
                    step === 0
                      ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                      : 'bg-blue-500 text-white hover:bg-blue-600'
                  }`}
                >
                  <ChevronLeft size={18} /> Previous
                </button>

                <button
                  onClick={nextStep}
                  disabled={step === steps.length - 1}
                  className={`px-4 py-2 rounded-lg flex items-center gap-2 font-semibold ${
                    step === steps.length - 1
                      ? 'bg-gray-300 text-gray-500 cursor-not-allowed'
                      : 'bg-blue-500 text-white hover:bg-blue-600'
                  }`}
                >
                  Next <ChevronRight size={18} />
                </button>

                <button onClick={togglePlay} className="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 flex items-center gap-2 font-semibold">
                  {isPlaying ? <><Pause size={18} /> Pause</> : <><Play size={18} /> Auto</>}
                </button>

                <div className="flex items-center gap-2">
                  <label className="font-semibold text-gray-700">Speed:</label>
                  <select
                    value={speed}
                    onChange={(e) => setSpeed(Number(e.target.value))}
                    className="px-3 py-2 border-2 border-gray-300 rounded-lg bg-white"
                  >
                    <option value={2000}>0.5x</option>
                    <option value={1000}>1x</option>
                    <option value={500}>2x</option>
                    <option value={250}>4x</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Algorithm Explanation */}
            <div className="bg-white rounded-xl shadow-lg p-6">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">🧠 How It Works</h2>
              <div className="space-y-3 text-gray-700">
                <div className="flex gap-3">
                  <div className="font-bold text-purple-600">Step 1:</div>
                  <div>Start with two pointers, one at the beginning of each list</div>
                </div>
                <div className="flex gap-3">
                  <div className="font-bold text-purple-600">Step 2:</div>
                  <div>Compare the values at both pointers</div>
                </div>
                <div className="flex gap-3">
                  <div className="font-bold text-purple-600">Step 3:</div>
                  <div>Take the smaller value, add it to result, move that pointer forward</div>
                </div>
                <div className="flex gap-3">
                  <div className="font-bold text-purple-600">Step 4:</div>
                  <div>Repeat until one list is empty</div>
                </div>
                <div className="flex gap-3">
                  <div className="font-bold text-purple-600">Step 5:</div>
                  <div>Append all remaining nodes from the non-empty list</div>
                </div>
              </div>

              <div className="mt-4 p-4 bg-green-50 rounded-lg">
                <div className="font-bold text-green-800">⏱️ Time Complexity: O(n + m)</div>
                <div className="text-green-700">We visit each node exactly once</div>
              </div>

              <div className="mt-2 p-4 bg-blue-50 rounded-lg">
                <div className="font-bold text-blue-800">💾 Space Complexity: O(1)</div>
                <div className="text-blue-700">We only use a few pointers (constant space)</div>
              </div>
            </div>

            {/* Python Code */}
            <div className="bg-gray-900 rounded-xl shadow-lg p-6 text-white">
              <h2 className="text-2xl font-bold mb-4 text-yellow-300">🐍 Python3 Code</h2>
              <pre className="text-sm overflow-x-auto">
{`# Definition for singly-linked list node
class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

def mergeTwoLists(list1, list2):
    """
    Merge two sorted linked lists into one sorted list

    Args:
        list1: Head of first sorted linked list
        list2: Head of second sorted linked list

    Returns:
        Head of merged sorted linked list
    """
    # Create a dummy node to make it easier
    dummy = ListNode(0)
    current = dummy

    # While both lists have nodes
    while list1 and list2:
        if list1.val < list2.val:
            current.next = list1
            list1 = list1.next
        else:
            current.next = list2
            list2 = list2.next
        current = current.next

    # Append remaining nodes (one list will be empty)
    if list1:
        current.next = list1
    if list2:
        current.next = list2

    # Return the merged list (skip dummy node)
    return dummy.next


# Example usage:
# Create list1: 1 -> 4 -> 7
list1 = ListNode(1, ListNode(4, ListNode(7)))

# Create list2: 2 -> 3 -> 8
list2 = ListNode(2, ListNode(3, ListNode(8)))

# Merge them
merged = mergeTwoLists(list1, list2)

# Result: 1 -> 2 -> 3 -> 4 -> 7 -> 8`}</pre>
            </div>

            {/* Key Points */}
            <div className="bg-white rounded-xl shadow-lg p-6">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">✨ Key Points to Remember</h2>
              <div className="space-y-2 text-gray-700">
                <div className="flex items-start gap-2">
                  <div className="text-purple-600 font-bold">•</div>
                  <div><strong>Dummy Node Trick:</strong> We use a dummy node at the start to simplify code. This avoids special cases for the first node.</div>
                </div>
                <div className="flex items-start gap-2">
                  <div className="text-purple-600 font-bold">•</div>
                  <div><strong>Two Pointers:</strong> We maintain pointers for list1, list2, and current position in result.</div>
                </div>
                <div className="flex items-start gap-2">
                  <div className="text-purple-600 font-bold">•</div>
                  <div><strong>Compare & Connect:</strong> At each step, compare values and connect the smaller node to our result.</div>
                </div>
                <div className="flex items-start gap-2">
                  <div className="text-purple-600 font-bold">•</div>
                  <div><strong>Leftover Nodes:</strong> When one list is exhausted, just attach the remaining list directly (it's already sorted!).</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MergeSortedListsSimple />);
  </script>
</body>
</html>
