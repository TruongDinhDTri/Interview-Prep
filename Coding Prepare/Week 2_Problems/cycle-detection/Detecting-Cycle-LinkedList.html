<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floyd's Cycle Detection - Tortoise & Hare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
<style id="mobile-safety-net">
/* ===== MOBILE SAFETY NET — auto-injected, non-destructive ===== */
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;}
img,svg,video,canvas,iframe{max-width:100%;height:auto;}
pre{overflow-x:auto;max-width:100%;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;margin:12px 0;}
.tbl-scroll>table{margin:0;}
@media (max-width:600px){
  table{max-width:100%;}
  h1,h2,h3{overflow-wrap:anywhere;word-break:break-word;}
}
</style>
<script id="mobile-safety-net-js">
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('table').forEach(function(t){
    var p=t.parentElement;
    if(p&&p.classList&&p.classList.contains('tbl-scroll'))return;
    var w=document.createElement('div');w.className='tbl-scroll';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
});
</script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inline SVG icons
    const Play = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );

    const Pause = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    );

    const RotateCcw = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
    );

    const ChevronLeft = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    );

    const ChevronRight = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    );

    const Zap = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    );

    const Turtle = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 10c-2 0-3 1-3 2"></path>
        <path d="M5 14c.5-2 2-3.5 4-4"></path>
        <path d="M14 18c1-.5 2-1.5 2.5-3"></path>
        <path d="M16.5 10c-.5-1.5-1.5-2.5-3-3"></path>
        <path d="M19 14c-.5 2-2 3.5-4 4"></path>
        <path d="M7 18c-1-.5-2-1.5-2.5-3"></path>
        <circle cx="12" cy="13" r="5"></circle>
        <path d="M12 8v-3"></path>
        <circle cx="12" cy="3" r="1"></circle>
      </svg>
    );

    function CycleDetector() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [speed, setSpeed] = useState(800);
      const [slowPos, setSlowPos] = useState(0);
      const [fastPos, setFastPos] = useState(0);
      const [cycleDetected, setCycleDetected] = useState(false);
      const [steps, setSteps] = useState(0);
      const [scenario, setScenario] = useState('cycle');
      const [history, setHistory] = useState([{ slowPos: 0, fastPos: 0 }]);
      const [historyIndex, setHistoryIndex] = useState(0);

      const scenarios = {
        cycle: {
          name: "Classic Cycle",
          nodes: [0, 1, 2, 3, 4, 5, 6, 7],
          cycleStart: 3,
          description: "A linked list with a cycle starting at node 3"
        },
        noCycle: {
          name: "No Cycle",
          nodes: [0, 1, 2, 3, 4, 5, 6, 7],
          cycleStart: null,
          description: "A normal linked list with no cycle"
        },
        smallCycle: {
          name: "Small Loop",
          nodes: [0, 1, 2, 3, 4],
          cycleStart: 2,
          description: "A tight cycle starting early"
        }
      };

      const currentScenario = scenarios[scenario];
      const nodes = currentScenario.nodes;
      const hasCycle = currentScenario.cycleStart !== null;

      const reset = () => {
        setSlowPos(0);
        setFastPos(0);
        setCycleDetected(false);
        setSteps(0);
        setIsPlaying(false);
        setHistory([{ slowPos: 0, fastPos: 0 }]);
        setHistoryIndex(0);
      };

      const calculateNextPositions = (currentSlow, currentFast) => {
        let newSlowPos = currentSlow + 1;
        let newFastPos = currentFast + 2;

        if (hasCycle) {
          if (newSlowPos >= currentScenario.cycleStart) {
            const cycleLength = nodes.length - currentScenario.cycleStart;
            newSlowPos = currentScenario.cycleStart + ((newSlowPos - currentScenario.cycleStart) % cycleLength);
          }
          if (newFastPos >= currentScenario.cycleStart) {
            const cycleLength = nodes.length - currentScenario.cycleStart;
            newFastPos = currentScenario.cycleStart + ((newFastPos - currentScenario.cycleStart) % cycleLength);
          }
        } else {
          if (newFastPos >= nodes.length) newFastPos = nodes.length - 1;
          if (newSlowPos >= nodes.length) newSlowPos = nodes.length - 1;
        }

        return { newSlowPos, newFastPos };
      };

      const stepForward = () => {
        if (cycleDetected) return;
        if (!hasCycle && (fastPos >= nodes.length - 1 || slowPos >= nodes.length - 1)) return;

        setIsPlaying(false);
        const { newSlowPos, newFastPos } = calculateNextPositions(slowPos, fastPos);

        setSlowPos(newSlowPos);
        setFastPos(newFastPos);
        setSteps(s => s + 1);

        const newHistory = [...history.slice(0, historyIndex + 1), { slowPos: newSlowPos, fastPos: newFastPos }];
        setHistory(newHistory);
        setHistoryIndex(newHistory.length - 1);

        if (newSlowPos === newFastPos && hasCycle) {
          setCycleDetected(true);
        }
      };

      const stepBackward = () => {
        if (historyIndex <= 0) return;
        setIsPlaying(false);
        setCycleDetected(false);

        const newIndex = historyIndex - 1;
        setHistoryIndex(newIndex);
        setSlowPos(history[newIndex].slowPos);
        setFastPos(history[newIndex].fastPos);
        setSteps(Math.max(0, steps - 1));
      };

      useEffect(() => {
        if (!isPlaying || cycleDetected) return;

        const timer = setTimeout(() => {
          if (!hasCycle && (fastPos >= nodes.length - 1 || slowPos >= nodes.length - 1)) {
            setIsPlaying(false);
            return;
          }

          const { newSlowPos, newFastPos } = calculateNextPositions(slowPos, fastPos);

          setSlowPos(newSlowPos);
          setFastPos(newFastPos);
          setSteps(s => s + 1);

          const newHistory = [...history.slice(0, historyIndex + 1), { slowPos: newSlowPos, fastPos: newFastPos }];
          setHistory(newHistory);
          setHistoryIndex(newHistory.length - 1);

          if (newSlowPos === newFastPos && hasCycle) {
            setCycleDetected(true);
            setIsPlaying(false);
          }
        }, speed);

        return () => clearTimeout(timer);
      }, [isPlaying, slowPos, fastPos, speed, cycleDetected, hasCycle, nodes.length, currentScenario.cycleStart]);

      const getNodePosition = (index) => {
        const centerX = 300;
        const centerY = 250;
        const radius = 150;
        const angle = (index / nodes.length) * Math.PI * 2 - Math.PI / 2;
        return {
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius
        };
      };

      const drawArrow = (fromIdx, toIdx) => {
        const from = getNodePosition(fromIdx);
        const to = getNodePosition(toIdx);
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const angle = Math.atan2(dy, dx);
        const startX = from.x + Math.cos(angle) * 30;
        const startY = from.y + Math.sin(angle) * 30;
        const endX = to.x - Math.cos(angle) * 30;
        const endY = to.y - Math.sin(angle) * 30;
        return { startX, startY, endX, endY, angle };
      };

      const isAtEnd = !hasCycle && (fastPos >= nodes.length - 1 || slowPos >= nodes.length - 1);

      return (
        <div className="w-full min-h-screen bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 p-8 overflow-auto">
          <div className="max-w-6xl mx-auto">
            {/* Header */}
            <div className="text-center mb-8">
              <h1 className="text-5xl font-bold text-white mb-3 drop-shadow-lg">
                🐢 The Tortoise & the Hare 🐰
              </h1>
              <p className="text-xl text-blue-200 mb-2">Floyd's Cycle Detection Algorithm</p>
              <p className="text-lg text-purple-200 italic">"If there's a loop, they'll meet again!"</p>
            </div>

            {/* Explanation Panel */}
            <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 mb-6 border-2 border-white/20">
              <h2 className="text-2xl font-bold text-yellow-300 mb-3">🎯 The Detective Story</h2>
              <p className="text-white text-lg leading-relaxed mb-4">
                Imagine two runners on a circular track: a <span className="text-green-400 font-bold">slow tortoise 🐢</span> who
                takes one step at a time, and a <span className="text-pink-400 font-bold">fast hare 🐰</span> who leaps two steps
                at a time. If the track loops back on itself (has a cycle), the speedy hare will eventually lap the tortoise and
                they'll meet at the same spot! But if the track ends normally, the hare will just reach the finish line first.
              </p>
              <p className="text-blue-200 text-base">
                {currentScenario.description}
              </p>
            </div>

            {/* Controls */}
            <div className="bg-white/10 backdrop-blur-md rounded-2xl p-6 mb-6 border-2 border-white/20">
              <div className="flex flex-wrap gap-4 items-center justify-center mb-4">
                <button
                  onClick={reset}
                  className="bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white px-6 py-3 rounded-xl font-bold text-lg flex items-center gap-2 shadow-lg transform transition hover:scale-105"
                >
                  <RotateCcw size={24} />
                  Reset
                </button>

                <button
                  onClick={stepBackward}
                  disabled={historyIndex <= 0}
                  className={`px-6 py-3 rounded-xl font-bold text-lg flex items-center gap-2 shadow-lg transform transition hover:scale-105 ${
                    historyIndex <= 0
                      ? 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      : 'bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white'
                  }`}
                >
                  <ChevronLeft size={24} />
                  Previous
                </button>

                <button
                  onClick={stepForward}
                  disabled={cycleDetected || isAtEnd}
                  className={`px-6 py-3 rounded-xl font-bold text-lg flex items-center gap-2 shadow-lg transform transition hover:scale-105 ${
                    cycleDetected || isAtEnd
                      ? 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      : 'bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white'
                  }`}
                >
                  Next
                  <ChevronRight size={24} />
                </button>

                <button
                  onClick={() => setIsPlaying(!isPlaying)}
                  disabled={cycleDetected || isAtEnd}
                  className={`px-8 py-3 rounded-xl font-bold text-lg flex items-center gap-2 shadow-lg transform transition hover:scale-105 ${
                    cycleDetected || isAtEnd
                      ? 'bg-gray-600 text-gray-400 cursor-not-allowed'
                      : 'bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white'
                  }`}
                >
                  {isPlaying ? <Pause size={24} /> : <Play size={24} />}
                  {isPlaying ? 'Pause' : 'Auto'}
                </button>
              </div>

              <div className="flex flex-wrap gap-4 justify-center mb-4">
                {Object.keys(scenarios).map(key => (
                  <button
                    key={key}
                    onClick={() => {
                      setScenario(key);
                      reset();
                    }}
                    className={`px-6 py-2 rounded-lg font-semibold transition ${
                      scenario === key
                        ? 'bg-yellow-400 text-purple-900'
                        : 'bg-white/20 text-white hover:bg-white/30'
                    }`}
                  >
                    {scenarios[key].name}
                  </button>
                ))}
              </div>

              <div className="flex items-center justify-center gap-4">
                <span className="text-white font-semibold">Speed:</span>
                <input
                  type="range"
                  min="200"
                  max="1500"
                  step="100"
                  value={speed}
                  onChange={(e) => setSpeed(Number(e.target.value))}
                  className="w-48"
                />
                <span className="text-blue-300">{speed}ms</span>
              </div>
            </div>

            {/* Stats */}
            <div className="grid grid-cols-3 gap-4 mb-6">
              <div className="bg-gradient-to-br from-green-500/30 to-green-700/30 backdrop-blur-sm rounded-xl p-4 border-2 border-green-400/50">
                <div className="flex items-center gap-2 mb-2">
                  <Turtle className="text-green-300" size={28} />
                  <span className="text-white font-bold text-lg">Tortoise</span>
                </div>
                <p className="text-3xl font-bold text-green-200">Node {nodes[slowPos]}</p>
                <p className="text-green-300 text-sm">+1 per step</p>
              </div>

              <div className="bg-gradient-to-br from-pink-500/30 to-pink-700/30 backdrop-blur-sm rounded-xl p-4 border-2 border-pink-400/50">
                <div className="flex items-center gap-2 mb-2">
                  <Zap className="text-pink-300" size={28} />
                  <span className="text-white font-bold text-lg">Hare</span>
                </div>
                <p className="text-3xl font-bold text-pink-200">Node {nodes[fastPos]}</p>
                <p className="text-pink-300 text-sm">+2 per step</p>
              </div>

              <div className="bg-gradient-to-br from-yellow-500/30 to-orange-700/30 backdrop-blur-sm rounded-xl p-4 border-2 border-yellow-400/50">
                <div className="text-white font-bold text-lg mb-2">Steps Taken</div>
                <p className="text-3xl font-bold text-yellow-200">{steps}</p>
                <p className="text-yellow-300 text-sm">iterations</p>
              </div>
            </div>

            {/* Visualization */}
            <div className="bg-white/5 backdrop-blur-sm rounded-3xl p-8 border-2 border-white/20 mb-6">
              <svg width="600" height="500" className="mx-auto">
                {/* Draw connections */}
                {nodes.map((node, idx) => {
                  const nextIdx = hasCycle && idx === nodes.length - 1
                    ? currentScenario.cycleStart
                    : idx < nodes.length - 1 ? idx + 1 : null;

                  if (nextIdx === null) return null;

                  const arrow = drawArrow(idx, nextIdx);
                  const isCycleEdge = hasCycle && idx === nodes.length - 1;

                  return (
                    <g key={`arrow-${idx}`}>
                      <line
                        x1={arrow.startX}
                        y1={arrow.startY}
                        x2={arrow.endX}
                        y2={arrow.endY}
                        stroke={isCycleEdge ? "#fbbf24" : "#60a5fa"}
                        strokeWidth={isCycleEdge ? "4" : "3"}
                        strokeDasharray={isCycleEdge ? "8,4" : "0"}
                        markerEnd="url(#arrowhead)"
                      />
                    </g>
                  );
                })}

                {/* Arrow marker definition */}
                <defs>
                  <marker
                    id="arrowhead"
                    markerWidth="10"
                    markerHeight="10"
                    refX="9"
                    refY="3"
                    orient="auto"
                  >
                    <polygon points="0 0, 10 3, 0 6" fill="#60a5fa" />
                  </marker>
                </defs>

                {/* Draw nodes */}
                {nodes.map((node, idx) => {
                  const pos = getNodePosition(idx);
                  const isSlow = idx === slowPos;
                  const isFast = idx === fastPos;
                  const isBoth = isSlow && isFast;

                  return (
                    <g key={`node-${idx}`}>
                      {/* Glow effect for active pointers */}
                      {(isSlow || isFast) && (
                        <circle
                          cx={pos.x}
                          cy={pos.y}
                          r="40"
                          fill={isBoth ? "#fbbf24" : isFast ? "#ec4899" : "#10b981"}
                          opacity="0.3"
                          className="animate-pulse"
                        />
                      )}

                      {/* Node circle */}
                      <circle
                        cx={pos.x}
                        cy={pos.y}
                        r="30"
                        fill={isBoth ? "#fbbf24" : isFast ? "#ec4899" : isSlow ? "#10b981" : "#4f46e5"}
                        stroke="white"
                        strokeWidth="3"
                      />

                      {/* Node number */}
                      <text
                        x={pos.x}
                        y={pos.y + 5}
                        textAnchor="middle"
                        fill="white"
                        fontSize="20"
                        fontWeight="bold"
                      >
                        {node}
                      </text>

                      {/* Pointer labels */}
                      {isBoth ? (
                        <text
                          x={pos.x}
                          y={pos.y - 45}
                          textAnchor="middle"
                          fill="#fbbf24"
                          fontSize="24"
                        >
                          🐢🐰
                        </text>
                      ) : (
                        <>
                          {isSlow && (
                            <text
                              x={pos.x}
                              y={pos.y - 45}
                              textAnchor="middle"
                              fill="#10b981"
                              fontSize="24"
                            >
                              🐢
                            </text>
                          )}
                          {isFast && (
                            <text
                              x={pos.x}
                              y={pos.y - 45}
                              textAnchor="middle"
                              fill="#ec4899"
                              fontSize="24"
                            >
                              🐰
                            </text>
                          )}
                        </>
                      )}
                    </g>
                  );
                })}
              </svg>
            </div>

            {/* Result */}
            {cycleDetected && (
              <div className="bg-gradient-to-r from-yellow-400 to-orange-500 rounded-2xl p-6 text-center animate-pulse">
                <p className="text-4xl font-bold text-purple-900 mb-2">
                  🎉 CYCLE DETECTED! 🎉
                </p>
                <p className="text-xl text-purple-800">
                  The tortoise and hare met at node {nodes[slowPos]} after {steps} steps!
                </p>
              </div>
            )}

            {!cycleDetected && !isPlaying && steps > 0 && !hasCycle && isAtEnd && (
              <div className="bg-gradient-to-r from-blue-400 to-green-500 rounded-2xl p-6 text-center">
                <p className="text-4xl font-bold text-white mb-2">
                  ✅ NO CYCLE FOUND
                </p>
                <p className="text-xl text-white">
                  The hare reached the end - this list is cycle-free!
                </p>
              </div>
            )}

            {/* The Algorithm Explained */}
            <div className="bg-white/10 backdrop-blur-md rounded-3xl p-6 mt-6 border-2 border-white/20">
              <h2 className="text-2xl font-bold text-cyan-300 mb-4">💡 Why This Works: The Math Magic</h2>
              <p className="text-white text-lg leading-relaxed mb-3">
                Here's the beautiful insight: if there's a cycle, think of it like a circular racing track. The hare moves twice
                as fast as the tortoise, which means it's closing the distance by one node every step. Once both runners are on
                the circular part, the gap between them shrinks by exactly one position each time. Eventually, that gap becomes
                zero, and boom—they meet!
              </p>
              <p className="text-blue-200 text-lg leading-relaxed">
                The time complexity is O(n) where n is the number of nodes, and the space complexity is O(1) because we only
                need two pointers. It's elegant, efficient, and absolutely brilliant! This algorithm was invented by Robert Floyd
                in the 1960s, earning its nickname "Floyd's Cycle-Finding Algorithm."
              </p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CycleDetector />);
  </script>
</body>
</html>
